name: Deploy website
# Builds the site with the current SlintLu documentation and LunaDash release notes and
# publishes it to this repository's GitHub Pages. Pages must use "GitHub Actions" as its
# source (Settings → Pages).
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Sync the SlintLu documentation
        run: |
          git clone --quiet --depth 1 https://github.com/LunaDashWM/SlintLu.git "$RUNNER_TEMP/SlintLu"
          python3 scripts/sync-slintlu.py "$RUNNER_TEMP/SlintLu"
      - name: Sync LunaDash release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: LuYishan-4/LunaDash
          LUDASH_SITE_SOURCE_DIR: ${{ github.workspace }}
        run: |
          git clone --quiet --depth 1 --branch dev https://github.com/LuYishan-4/LunaDash.git "$RUNNER_TEMP/LunaDash"
          python3 "$RUNNER_TEMP/LunaDash/scripts/site/sync-releases.py"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts
      - name: Build website
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
