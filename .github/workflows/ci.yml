name: Website CI
# Builds pull requests; pushes to main are built and deployed by pages.yml.
on:
  pull_request:
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts
      - name: Build website
        run: npm run build
